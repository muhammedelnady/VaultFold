name: Release Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Production Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Quality Gate
        run: |
          npx --yes expo-doctor@1.21.5
          npm run verify

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit Production Build
        run: |
          echo "Building and submitting production release..."
