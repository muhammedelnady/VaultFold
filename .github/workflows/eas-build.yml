name: EAS Build (Preview)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: EAS Build Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Build (Dry-run or Preview Profile)
        run: |
          echo "Triggering EAS Build for profile 'preview' with review tools enabled..."
